<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boom Orbs</title>
    <meta name="description" content="A 4-player bomb-maze brawl set in the Critter Catch world." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='9' r='6' fill='%232b2f77' stroke='%231b1b2f'/%3E%3Crect x='2' y='8' width='12' height='2' fill='%23ff6b4a'/%3E%3Ccircle cx='9' cy='2' r='1.5' fill='%23ffd23f'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #141428;
        --panel: #22224a;
        --ink: #f4f4f4;
        --dim: #b4b4d2;
        --accent: #ffd23f;
        --p1: #3fd0cb;
        --p2: #ff7a85;
        --p3: #8fe07a;
        --p4: #c49bff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 10px/1.8 "Press Start 2P", monospace; }
      main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
      header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
      h1 { font-size: 14px; margin: 0; color: var(--accent); }
      .hud { display: flex; flex-wrap: wrap; gap: 4px 16px; }
      #score { display: flex; flex-wrap: wrap; gap: 0 12px; }
      .hud .out { opacity: 0.4; }
      #timer.hurry { color: var(--p2); }
      /* Fit the whole board on screen: the stage is as wide as the viewport height allows. */
      .stage { position: relative; width: min(100%, calc((100dvh - 120px) * 240 / 208)); margin: 0 auto; border: 4px solid var(--ink); border-radius: 4px; background: #000; }
      canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      #status { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 16px; background: rgb(20 20 40 / 0.6); }
      #status[hidden] { display: none; }
      #status p { margin: 0; max-width: 40ch; }
      #statusText { font-size: 14px; color: var(--accent); }
      #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 90%; background: var(--panel); border: 2px solid var(--ink); padding: 6px 10px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
      #toast.show { opacity: 1; }
      .panel { background: var(--panel); border: 4px solid var(--ink); border-radius: 4px; padding: 12px; }
      .panel h2 { margin: 0 0 8px; font-size: 11px; color: var(--accent); }
      #legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      #legend li { display: flex; gap: 10px; align-items: center; }
      #legend canvas { width: 32px; flex: none; }
      #lobby { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; overflow: auto; background: rgb(20 20 40 / 0.75); }
      #lobby[hidden] { display: none; }
      #lobby .card { background: var(--panel); border: 4px solid var(--ink); border-radius: 4px; padding: 16px; display: grid; gap: 12px; width: min(100%, 460px); }
      #lobby h2 { margin: 0; font-size: 12px; color: var(--accent); }
      #lobby label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
      #name { font: inherit; flex: 1; min-width: 0; padding: 8px; background: var(--bg); color: var(--ink); border: 2px solid var(--dim); }
      #seats { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      #seats li { display: flex; gap: 10px; align-items: center; min-height: 36px; }
      #seats img { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
      #seats span { flex: 1; overflow-wrap: anywhere; }
      #seats button { padding: 6px 8px; }
      #lobby .settings { display: flex; flex-wrap: wrap; gap: 8px 16px; }
      select { font: inherit; padding: 6px; background: var(--bg); color: var(--ink); border: 2px solid var(--dim); }
      input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
      button { font: inherit; background: var(--accent); color: var(--bg); border: 0; padding: 10px 12px; cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .help { color: var(--dim); margin: 0; }
      .p1 { color: var(--p1); }
      .p2 { color: var(--p2); }
      .p3 { color: var(--p3); }
      .p4 { color: var(--p4); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Boom Orbs</h1>
        <div class="hud" aria-live="off">
          <span id="score"></span>
          <span id="timer">2:00</span>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="240" height="208" aria-label="Arena"></canvas>
        <div id="status" hidden>
          <p id="statusText"></p>
          <p id="statusSub" class="help"></p>
        </div>
        <div id="toast" role="status" aria-live="polite"></div>
        <section id="lobby" aria-label="Lobby" hidden>
          <div class="card">
            <h2>Room <span id="roomCode"></span></h2>
            <button id="copy" type="button">Copy invite link</button>
            <label>Your name <input id="name" maxlength="12" autocomplete="nickname" placeholder="Trainer" /></label>
            <ol id="seats"></ol>
            <label><input type="checkbox" id="bots" /> Fill empty seats with bots</label>
            <div class="settings">
              <label>Map <select id="map"></select></label>
              <label>Mode
                <select id="mode"><option value="ffa">Free-for-all</option><option value="teams">2v2 teams</option></select>
              </label>
              <label>First to
                <select id="wins"><option>1</option><option>2</option><option>3</option><option>5</option></select>
              </label>
            </div>
            <button id="ready" type="button" hidden>Ready!</button>
            <p id="lobbyNote" class="help" aria-live="polite"></p>
          </div>
        </section>
      </div>

      <p class="help">
        <span id="who"></span>
        Move: arrows / WASD. Drop orb: Space / Z. Detonate (Remote): X / Shift.
        Last trainer standing wins the round; first to 2 rounds wins. At 0:00 the walls close in.
      </p>

      <section class="panel" aria-label="Power-ups">
        <h2>Power-ups</h2>
        <ul id="legend"></ul>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
